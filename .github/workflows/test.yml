name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PySide6
        run: pip install PySide6
      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -q
