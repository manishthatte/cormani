# corMani — packaging.
#
# setuptools rather than a newer backend, and a src-less layout, because the
# target is the Debian source tree: dh-python understands this shape without
# help, and every build dependency here is already a Debian package.
#
# There are no runtime dependencies listed. That is deliberate and enforced by
# a test: PySide6 and keyring come from the distribution, and everything else
# is the standard library. See CONVENTIONS.txt §3.
#
# © Manish Jagdish Thatte
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cormani"
version = "0.1.0"
description = "A correspondence client: mail, calendar, and the sites that have no API"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Manish Jagdish Thatte" }]
keywords = ["mail", "imap", "smtp", "calendar", "correspondence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
]

# PySide6 and keyring are NOT listed. They are distribution packages
# (python3-pyside6.*, python3-keyring); declaring them here would invite pip to
# install a second, vendored copy, which is exactly what Debian forbids.
dependencies = []

[project.scripts]
cormani = "cormani.__main__:main"

[project.urls]
Homepage = "https://github.com/manishthatte/cormani"

[tool.setuptools.packages.find]
include = ["cormani*"]

[tool.setuptools.package-data]
cormani = ["data/*.svg", "data/*.xml", "data/*.desktop"]
